<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.4" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="50" result="blur" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.6; }
    }
    @keyframes flowDash {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatCardAlt {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: 200px 100px; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite alternate-reverse; transform-origin: 1000px 300px; }
    .flow-line { stroke-dasharray: 8 6; animation: flowDash 20s linear infinite; }
    .floating-node-1 { animation: floatCard 6s ease-in-out infinite; }
    .floating-node-2 { animation: floatCardAlt 7s ease-in-out infinite; }
    .floating-node-3 { animation: floatCard 8s ease-in-out infinite; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="orb-1" cx="220" cy="120" r="160" fill="#3b82f6" filter="url(#orbGlow)" />
  <circle class="orb-2" cx="980" cy="300" r="180" fill="#8b5cf6" filter="url(#orbGlow)" />
  <circle class="orb-1" cx="600" cy="380" r="130" fill="#ec4899" filter="url(#orbGlow)" opacity="0.2" />

  <!-- Animated Background Process Flow (Requisition to Pay) -->
  <g opacity="0.3" class="flow-line">
    <path d="M 100 350 C 300 380, 450 310, 600 340 C 750 370, 900 310, 1100 340" fill="none" stroke="url(#accentGrad)" stroke-width="3" />
    <path d="M 120 70 C 350 40, 500 110, 650 60 C 800 20, 950 80, 1080 50" fill="none" stroke="url(#accentGrad)" stroke-width="2" />
  </g>

  <!-- Interactive Diagram Nodes Floating in Background -->
  <g class="floating-node-1" opacity="0.6">
    <rect x="70" y="270" width="150" height="48" rx="10" fill="url(#nodeGrad1)" stroke="#60a5fa" stroke-width="1.2" />
    <text x="145" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e0f2fe" text-anchor="middle">📋 1. Requisition</text>
  </g>

  <g class="floating-node-2" opacity="0.6">
    <rect x="260" y="320" width="140" height="48" rx="10" fill="url(#nodeGrad2)" stroke="#a78bfa" stroke-width="1.2" />
    <text x="330" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ede9fe" text-anchor="middle">⚖️ 2. RFQ & Sourcing</text>
  </g>

  <g class="floating-node-3" opacity="0.6">
    <rect x="800" y="320" width="150" height="48" rx="10" fill="url(#nodeGrad2)" stroke="#a78bfa" stroke-width="1.2" />
    <text x="875" y="350" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ede9fe" text-anchor="middle">📦 3. Purchase Order</text>
  </g>

  <g class="floating-node-1" opacity="0.6">
    <rect x="990" y="270" width="140" height="48" rx="10" fill="url(#nodeGrad3)" stroke="#f472b6" stroke-width="1.2" />
    <text x="1060" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fce7f3" text-anchor="middle">💳 4. 3-Way Match</text>
  </g>

  <!-- Foreground Content Area: Clear, Sharp, High Contrast (No Overlap) -->
  <!-- Top Category Pill -->
  <g>
    <rect x="440" y="55" width="320" height="34" rx="17" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="url(#glow)" />
    <text x="600" y="77" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#60a5fa" letter-spacing="1.5" text-anchor="middle">AWESOME ECOSYSTEM REPO</text>
  </g>

  <!-- Main Headline Title -->
  <text x="600" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-0.5">
    E-Procurement &amp; Purchasing Management
  </text>

  <!-- Accent Gradient Rule -->
  <rect x="420" y="172" width="360" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Subtitle -->
  <text x="600" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#cbd5e1" text-anchor="middle">
    Curated SaaS Platforms, Enterprise Suites &amp; Open-Source Projects
  </text>

  <!-- Feature Highlights / Badges in Foreground -->
  <g transform="translate(600, 252)">
    <!-- Pill 1 -->
    <g transform="translate(-310, 0)">
      <rect x="0" y="0" width="190" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="95" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">⚡ Requisition-to-Pay</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(-95, 0)">
      <rect x="0" y="0" width="190" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="95" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">🛡️ 3-Way Invoice Matching</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(120, 0)">
      <rect x="0" y="0" width="190" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="95" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8" text-anchor="middle">📊 Spend Analytics &amp; Control</text>
    </g>
  </g>
</svg>